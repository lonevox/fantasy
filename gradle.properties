# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G

# Note: every property used in mod metadata files must also be added to the
# expandProps map in build-logic/src/main/groovy/multiloader-common.gradle

# Mod Properties
mod_version=0.8.0
maven_group=xyz.nucleoid
mod_id=fantasy
mod_name=Fantasy
mod_author=Nucleoid Contributors
